version: "3.9"

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realestate_backend
    command: >
      gunicorn real_estate_api.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
    environment:
      AWS_REGION: "us-west-2"
      DJANGO_DEBUG: "False"
      DJANGO_SETTINGS_MODULE: "real_estate_api.settings"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    networks:
      - webnet
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static
      - media_volume:/app/media
    networks:
      - webnet
    restart: always

volumes:
  static_volume:
  media_volume:

networks:
  webnet:
    driver: bridge
